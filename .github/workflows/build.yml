name: build

# Windows / macOS / Linux の 3 つで、同じコードがビルドできることを確かめる。
# 手元に無い OS 向けの成果物も、ここで作って Artifacts から取り出せる。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build MindMapX.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/MindMap.Desktop/MindMap.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: MindMap-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
